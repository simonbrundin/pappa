# ============================================================================
# IT-personal i Sundsvall-området — frölista för rekrytering
# ============================================================================
# Genererad: 2026-11-08 (uppdaterad: ledning ur bolagsregister + GTC-bios)
# Metod:       Webbsökning (Exa) + hämtning av organisations- och konferenssidor,
#             LinkedIn-profiler som exponerats i sökresultat, samt 2026-11
#             offentligt bolagsregister (Bolagsverket via allabolag/
#             alltombolag/bolagsfakta/rating.se) för styrelser i små IT-bolag.
#
# VIKTIGT - vad detta är och inte är:
#   Detta är en FRÖLISTA, inte "alla IT-personer i Sundsvall".
#   Populationen är MÄTT, inte uppskattad, via SCB:s Yrkesregister
#   (dagbefolkning, BAS 2024):
#     - Sundsvalls kommun:  3 469 anställda i IT-yrken
#         (189 IT-chefer, 2 576 IT-specialister, 704 drift/support/nätverk)
#     - Västernorrlands län: 4 674 anställda i IT-yrken
#     - Riket: 248 417
#   Se `data/scb-it-statistik-sundsvall.json` för rådata och tabell-ID.
#   140 namngivna personer = ~4 % av Sundsvalls IT-arbetsplatser. Webben kan
#   aldrig ge hela populationen; filen ger de som är offentligt synliga i
#   ledning, team-sidor, konferensprogram, community-spelningar och bolagsregister.
#
#   Täckningsluckor: anonyma utvecklare (utan chefroll, utan talarepass,
#   utan publicerad profil), folk som bytt jobb, och folk i bolag utan
#   publicerade team-sidor. Sedan 2026-11 är ledningen i 15 mindre lokala
#   IT-bolag täckt via bolagsregistret (Portalplus, Crestit, Swedish
#   Connection, Arkaden, Synetics, Syndis, IT-Entreprenörerna, Fostira, SDK,
#   Milsvida, Not Not, CoreIT, Agilis, Software Dynamics, Retail Data,
#   goLive). Kvarvarande luckor: Koneo, A3 IT, Why IT (uppköpt av Nethouse),
#   Amplifyit, Arcus/StjärnaFyrkant, Sundsvalls It & Automation, Crownit
#   samt alla bolag utan publicerad styrelse.
#
# GDPR:
#   Namn, titel, arbetsgivare och publicerad affärsmejl/telefon = personuppgift.
#   Rättslig grund för rekryteringskontakt: legitima intressen (Art. 6.1.f).
#   Detta innebär KRAV PÅ ART. 14-INFORMATION till varje kontaktad person
#   (information inom en månad: vem ni är, varifrån uppgiften kommer, hur
#   länge ni sparar, rätten att invända). Se `legal` nedan.
#   Personuppgifter om tredje part får INTE förekomma i allmänna handlingar
#   (OSL 21 kap. 7 §) - men det gäller myndigheters utlämnande, inte er
#   egen rekryteringsdatabas. Egen databas kräver istället dokumenterad
#   intresseavvägning + information + gallring.
#
#   Publicerade affärskontakter på en arbetsgivares egen webbplats är av
#  sedda avsedda för kontakt. Använd dem i rekryteringssyfte, inte för
#  massutskick. Se `legal.do_not` och `next_steps`.
# ============================================================================

