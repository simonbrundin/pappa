    effort: "2-3 veckor"

# ============================================================================
# NOTER OM METOD OCH DATAKVALITET
# ============================================================================
notes:
  - "Källor: org_website, linkedin_public, conference, conference_program, community, press, public_record. Varje person ska ha minst en källa."
  - "public_record = offentligt bolagsregister (Bolagsverket). Ger styrelse och VD, alltså personer som faktiskt bestämmer i mindre IT-bolag."
  - "Bolagsregister ger INNEHÅLL i bolaget, inte en yrkestitel. Kompetensmarkeringen är därför en hypotes om vad bolaget gör."
  - "it_experience_years skrivs bara ut när värdet är explicit källbelagt. Annars härleds det av importen (notes -> rollnivå) och grundens sparas i it_experience_basis."
  - "Anställningshistorik ligger i data/employment-history.yaml - se db/import_from_yaml.py för hur den adopterar och räknar om intervall."
  - "Dubbletter: importen hittar dubbletter med fn_find_duplicates (trigramlikhet). Granska listan som skrivs ut efter varje körning."
  - "Filen är gitignorerad? Nej - data/ versionshålls, men db/backups/ (databasdumpar med personuppgifter) är gitignoreras."
