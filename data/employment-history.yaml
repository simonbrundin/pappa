# Anställningshistorik - kuraterad ur publika källor
#
# Syfte: ge kandidaterna en CV-liknande historik (var, vad, hur länge) så att
# erfarenhet kan bedömas på riktigt i stället för gissas ur rollnivå.
#
# Regler
#   1. Varje rad ska ha en källa - 'source' pekar på den URL där uppgiften
#      står (samma källa som i frölistan där det går att belägga).
#   2. 'from'/'to' är ISO-datum (YYYY-MM-DD, YYYY-MM eller YYYY).
#      null = okänt. Båda null = perioden är helt okänd.
#   3. 'current: true' = pågående tjänst. En person har högst en sådan rad.
#   4. 'confidence' = hur väl dokumenterad raden är:
#        high   - belagd av källa (t.ex. pressmeddelande med datum)
#        medium - utläst ur fritext på en offentlig sida
#        low    - hypotes, ska verifieras
#   5. 'stack' = taggar från competence_taxonomy i frölistan.
#
# Importen upsertar på (person_id, ref) - samma ref uppdateras, aldrig
# dupliceras. Den gamla importen skapade en rad per person utan ref; den
# adopteras av raden med current: true.
#
# Underlaget genereras med: python db/extract_employment_candidates.py
# och kurateras sedan för hand.

people:
