apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuxt-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nuxt-app
  template:
    metadata:
      labels:
        app: nuxt-app
    spec:
      containers:
        - name: nuxt-app
          image: nuxt-app:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          env:
            # runtimeConfig.databaseUrl i nuxt.config.ts - läses av
            # server/utils/db.ts. Poolad Neon-endpoint (PgBouncer).
            - name: NUXT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pappa-neon-db
                  key: DATABASE_URL
            # Admin-token för skrivning (dubblettsammanslagning). Utan token
            # är sammanslagning avsintentligt avstängd (503) - appen startar
            # ändå. Skapa hemligheten externt:
            #   kubectl -n pappa create secret generic pappa-admin \
            #     --from-literal=NUXT_ADMIN_TOKEN="$(openssl rand -hex 24)"
            - name: NUXT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pappa-admin
                  key: NUXT_ADMIN_TOKEN
                  optional: true
